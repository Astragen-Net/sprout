name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path validation/capture/Cargo.toml -- --check
      - name: Clippy
        run: >-
          cargo clippy --manifest-path validation/capture/Cargo.toml
          --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path validation/capture/Cargo.toml --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: validation/analysis/requirements.txt
      - name: Install
        run: python -m pip install -r validation/analysis/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s validation/analysis -p "test_*.py"
      - name: Fixture smoke test
        run: |
          cd validation
          python analysis/load.py --input fixtures --db data/fixture.duckdb --reset --include-active
          python analysis/signals.py --db data/fixture.duckdb --out data/processed/fixture.parquet
          python analysis/evaluate.py --features data/processed/fixture.parquet --horizon 12h --out data/fixture_report.md
